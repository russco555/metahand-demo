<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MetaHand – hand + held product segmentation</title>
<style>
  :root { --bg:#101216; --panel:#181b21; --line:#2a2e36; --text:#e9ecf1; --muted:#9aa1ad; --ok:#4ade80; --warn:#fbbf24; --bad:#f87171; }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--bg); color:var(--text); font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  header { padding:18px 18px 10px; border-bottom:1px solid var(--line); }
  h1 { margin:0 0 4px; font-size:22px; }
  header p { margin:0; color:var(--muted); font-size:14px; }
  #status { margin-top:8px; font-size:13px; color:var(--warn); }
  #status.ok { color:var(--ok); } #status.bad { color:var(--bad); }
  main { padding:12px 18px; }
  .stage { position:relative; width:100%; max-width:520px; margin:0 auto; border-radius:14px; overflow:hidden; background:#000; aspect-ratio:3/4; }
  #out { width:100%; height:100%; object-fit:cover; display:block; }
  #badge { position:absolute; left:10px; top:10px; padding:4px 9px; border-radius:999px; font-size:12px; background:rgba(0,0,0,.55); }
  .controls { display:flex; flex-wrap:wrap; gap:8px; max-width:520px; margin:12px auto 0; }
  button, .file { flex:1 1 auto; padding:11px 12px; border-radius:10px; border:1px solid var(--line); background:var(--panel); color:var(--text); font-size:14px; text-align:center; cursor:pointer; }
  button:disabled { opacity:.45; }
  .file input { display:none; }
  label.chk { display:flex; align-items:center; gap:6px; color:var(--muted); font-size:13px; padding:4px 2px; }
  #stats { max-width:520px; margin:10px auto 30px; color:var(--muted); font:12px/1.5 ui-monospace,Menlo,monospace; white-space:pre-wrap; }
  #video { position:absolute; width:1px; height:1px; opacity:0; pointer-events:none; }
</style>
<!-- GitHub Pages redeploy trigger: safety-gate removal build -->
</head>
<body>
<header>
  <h1>MetaHand Live · Product</h1>
  <p>Hand + allowlisted held product, segmented and composited</p>
  <div id="status">Loading models…</div>
</header>
<main>
  <div class="stage">
    <canvas id="out"></canvas>
    <div id="badge">idle</div>
  </div>
  <div class="controls">
    <button id="start" disabled>Start camera</button>
    <button id="flip" disabled>Flip camera</button>
    <label class="file">Background<input id="bgfile" type="file" accept="image/*"></label>
  </div>
  <div class="controls">
    <label class="chk"><input type="checkbox" id="debug"> Show mask overlay</label>
    <label class="chk"><input type="checkbox" id="depthMode"> Experimental: depth + skin</label>
  </div>
  <div class="controls" id="depthControls" hidden>
    <label class="chk" for="depthNear">Nearest foreground: <span id="depthNearValue">45%</span></label>
    <input id="depthNear" type="range" min="20" max="80" step="5" value="45" style="width:100%">
  </div>
  <div id="stats"></div>
</main>
<video id="video" playsinline muted autoplay></video>

<script type="module">
import {
  FilesetResolver, HandLandmarker, ObjectDetector, ImageSegmenter, InteractiveSegmenter
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

// ---------------- Config ----------------
const CFG = {
  // Only these detector classes may be kept in the hand. COCO "hot dog" is the
  // stand-in for a sausage until a custom product model is trained.
  ALLOWED: ["hot dog"],
  DETECT_MIN_SCORE: 0.3,
  WORK_W: 320,            // processing width (height follows camera aspect)
  OUT_MAX_H: 960,         // output canvas max height
  DETECT_EVERY: 3,        // run object detector every N frames
  OBJMASK_EVERY: 4,       // refresh object mask every N frames
  OBJ_MISS_LIMIT: 3,      // detector misses before dropping the object
  HAND_PAD: 0.35,         // pad hand bbox by this fraction of its size
  OBJ_PAD: 0.10,
  SKIN_CAT: 2,            // selfie_multiclass: 2 = body-skin
  FEATHER_PX: 2,
};

const WASM = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm";
const M = {
  hand:  "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
  det:   "https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/float16/1/efficientdet_lite0.tflite",
  seg:   "https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_multiclass_256x256/float32/latest/selfie_multiclass_256x256.tflite",
  magic: "https://storage.googleapis.com/mediapipe-models/interactive_segmenter/magic_touch/float32/1/magic_touch.tflite",
};

// ---------------- DOM ----------------
const $ = (id) => document.getElementById(id);
const video = $("video"), out = $("out"), octx = out.getContext("2d");
const statusEl = $("status"), statsEl = $("stats"), badge = $("badge");
const startBtn = $("start"), flipBtn = $("flip"), debugChk = $("debug");
const depthMode = $("depthMode"), depthNear = $("depthNear"), depthNearValue = $("depthNearValue"), depthControls = $("depthControls");
const setStatus = (t, cls = "") => { statusEl.textContent = t; statusEl.className = cls; };

const mk = (w = 1, h = 1, rf = false) => {
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  return [c, c.getContext("2d", rf ? { willReadFrequently: true } : undefined)];
};
const [work, wctx]   = mk(1, 1, true);  // downscaled camera frame
const [maskC, mctx]  = mk();            // alpha mask at work res
const [cut, cctx]    = mk();            // camera cut-out at output res
const [stage, sctx]  = mk();            // composited frame (what would be sent)

// ---------------- Models ----------------
let hands, detector, skinSeg, objSeg;
let depthEstimator = null, depthBusy = false, depthMap = null, depthW = 0, depthH = 0, depthUpdatedAt = 0, depthFrame = 0;
const [depthInput, depthInputCtx] = mk(1, 1);

async function create(Cls, vision, path, extra) {
  for (const delegate of ["GPU", "CPU"]) {
    try {
      return await Cls.createFromOptions(vision, { baseOptions: { modelAssetPath: path, delegate }, ...extra });
    } catch (e) { if (delegate === "CPU") throw e; }
  }
}

async function loadModels() {
  const vision = await FilesetResolver.forVisionTasks(WASM);
  [hands, detector, skinSeg, objSeg] = await Promise.all([
    create(HandLandmarker, vision, M.hand, { runningMode: "VIDEO", numHands: 2 }),
    create(ObjectDetector, vision, M.det, {
      runningMode: "VIDEO", scoreThreshold: CFG.DETECT_MIN_SCORE,
      categoryAllowlist: CFG.ALLOWED, maxResults: 3,
    }),
    create(ImageSegmenter, vision, M.seg, { runningMode: "VIDEO", outputCategoryMask: true, outputConfidenceMasks: false }),
    create(InteractiveSegmenter, vision, M.magic, { outputCategoryMask: false, outputConfidenceMasks: true }),
  ]);
}

// ---------------- Camera ----------------
let stream = null, facing = "user", running = false;

async function startCamera() {
  if (stream) stream.getTracks().forEach((t) => t.stop());
  stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false,
  });
  video.srcObject = stream;
  await video.play();
  await new Promise((r) => (video.videoWidth ? r() : video.addEventListener("loadedmetadata", r, { once: true })));
  sizeCanvases();
  if (!running) { running = true; requestAnimationFrame(loop); }
}

function sizeCanvases() {
  const vw = video.videoWidth, vh = video.videoHeight;
  work.width = CFG.WORK_W; work.height = Math.round(CFG.WORK_W * vh / vw);
  maskC.width = work.width; maskC.height = work.height;
  maskImg = mctx.createImageData(work.width, work.height);
  const oh = Math.min(vh, CFG.OUT_MAX_H), ow = Math.round(oh * vw / vh);
  for (const c of [out, cut, stage]) { c.width = ow; c.height = oh; }
  document.querySelector(".stage").style.aspectRatio = `${ow}/${oh}`;
}

// ---------------- Background ----------------
let bgImg = null;
$("bgfile").addEventListener("change", (e) => {
  const f = e.target.files?.[0]; if (!f) return;
  const img = new Image(); img.onload = () => (bgImg = img); img.src = URL.createObjectURL(f);
});
function drawBackground(ctx, w, h) {
  if (bgImg) {
    const s = Math.max(w / bgImg.width, h / bgImg.height);
    const bw = bgImg.width * s, bh = bgImg.height * s;
    ctx.drawImage(bgImg, (w - bw) / 2, (h - bh) / 2, bw, bh);
  } else {
    const g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, "#8fb3d9"); g.addColorStop(0.38, "#cfe0ef");
    g.addColorStop(0.40, "#2c5c7a"); g.addColorStop(0.62, "#3f7f8f");
    g.addColorStop(0.70, "#e8eef0"); g.addColorStop(1, "#cbb89a");
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  }
}

// ---------------- Geometry helpers (normalized 0..1) ----------------
function landmarkBox(lm, pad) {
  let x0 = 1, y0 = 1, x1 = 0, y1 = 0;
  for (const p of lm) { x0 = Math.min(x0, p.x); y0 = Math.min(y0, p.y); x1 = Math.max(x1, p.x); y1 = Math.max(y1, p.y); }
  const s = Math.max(x1 - x0, y1 - y0) * pad;
  return { x0: x0 - s, y0: y0 - s, x1: x1 + s, y1: y1 + s };
}
const padBox = (b, pad) => {
  const px = (b.x1 - b.x0) * pad, py = (b.y1 - b.y0) * pad;
  return { x0: b.x0 - px, y0: b.y0 - py, x1: b.x1 + px, y1: b.y1 + py };
};
const overlaps = (a, b) => a.x0 < b.x1 && a.x1 > b.x0 && a.y0 < b.y1 && a.y1 > b.y0;
const toPx = (b, W, H) => ({
  x0: Math.max(0, Math.floor(b.x0 * W)), y0: Math.max(0, Math.floor(b.y0 * H)),
  x1: Math.min(W, Math.ceil(b.x1 * W)),  y1: Math.min(H, Math.ceil(b.y1 * H)),
});

// ---------------- State ----------------
let maskImg = null, frame = 0, lastTs = -1;
let skin = null, skinW = 0, skinH = 0;
let objBox = null, objScore = 0, objMiss = 0;
let objMask = null, objMaskW = 0, objMaskH = 0;
let handCount = 0, fps = 0, lastFpsT = performance.now(), fpsFrames = 0;
// ---------------- Main loop ----------------
function loop() {
  if (!running) return;
  const ts = performance.now();
  if (video.readyState >= 2 && ts > lastTs) { lastTs = ts; process(ts); }
  requestAnimationFrame(loop);
}

function process(ts) {
  const W = work.width, H = work.height;
  wctx.drawImage(video, 0, 0, W, H);
  frame++;
  if (depthMode.checked && depthEstimator && !depthBusy && frame % 10 === 0) updateDepth();

  // 1. Hands
  const hr = hands.detectForVideo(work, ts);
  handCount = hr.landmarks.length;
  const handBoxes = hr.landmarks.map((lm) => landmarkBox(lm, CFG.HAND_PAD));

  // 2. Skin mask
  skinSeg.segmentForVideo(work, ts, (r) => {
    const m = r.categoryMask; if (!m) return;
    skin = m.getAsUint8Array().slice(); skinW = m.width; skinH = m.height;
  });

  // 3. Allowlisted object that overlaps a hand
  if (frame % CFG.DETECT_EVERY === 0) {
    const dr = detector.detectForVideo(work, ts);
    let best = null, bestScore = 0;
    for (const d of dr.detections) {
      const bb = d.boundingBox, sc = d.categories[0]?.score ?? 0;
      const b = { x0: bb.originX / W, y0: bb.originY / H, x1: (bb.originX + bb.width) / W, y1: (bb.originY + bb.height) / H };
      if (handBoxes.some((h) => overlaps(b, h)) && sc > bestScore) { best = b; bestScore = sc; }
    }
    if (best) { objBox = best; objScore = bestScore; objMiss = 0; }
    else if (++objMiss >= CFG.OBJ_MISS_LIMIT) { objBox = null; objMask = null; objScore = 0; }
  }

  // 4. Object mask seeded at the detection centre
  if (objBox && frame % CFG.OBJMASK_EVERY === 0) {
    const kp = { x: (objBox.x0 + objBox.x1) / 2, y: (objBox.y0 + objBox.y1) / 2 };
    objSeg.segment(work, { keypoint: kp }, (r) => {
      const m = r.confidenceMasks?.[0]; if (!m) return;
      objMask = m.getAsFloat32Array().slice(); objMaskW = m.width; objMaskH = m.height;
    });
  }

  // 5. Build alpha mask at work resolution
  const d = maskImg.data; d.fill(0);
  if (handCount && skin && !(depthMode.checked && depthMap && performance.now() - depthUpdatedAt < 2200)) {
    for (const hb of handBoxes) {
      const p = toPx(hb, W, H);
      for (let y = p.y0; y < p.y1; y++) {
        const sy = Math.floor(y * skinH / H) * skinW;
        for (let x = p.x0; x < p.x1; x++) {
          if (skin[sy + Math.floor(x * skinW / W)] === CFG.SKIN_CAT) {
            const i = (y * W + x) * 4; d[i + 1] = 255; d[i + 3] = 255;
          }
        }
      }
    }
    if (objBox && objMask) {
      const p = toPx(padBox(objBox, CFG.OBJ_PAD), W, H);
      for (let y = p.y0; y < p.y1; y++) {
        const oy = Math.floor(y * objMaskH / H) * objMaskW;
        for (let x = p.x0; x < p.x1; x++) {
          if (objMask[oy + Math.floor(x * objMaskW / W)] > 0.5) {
            const i = (y * W + x) * 4; d[i] = 255; d[i + 1] = 160; d[i + 3] = 255;
          }
        }
      }
    }
  }
  if (depthMode.checked && depthMap && performance.now() - depthUpdatedAt < 2200 && skin) {
    // Hybrid mask: skin semantics remove non-skin objects; relative depth keeps only the nearest skin pixels.
    const d = maskImg.data;
    const nearFraction = Number(depthNear.value) / 100;
    const cutoff = depthMap.cutoff;
    for (let y = 0; y < H; y++) {
      const sy = Math.min(skinH - 1, Math.floor(y * skinH / H)) * skinW;
      const dy = Math.min(depthH - 1, Math.floor(y * depthH / H)) * depthW;
      for (let x = 0; x < W; x++) {
        if (skin[sy + Math.min(skinW - 1, Math.floor(x * skinW / W))] !== CFG.SKIN_CAT) continue;
        const z = depthMap.data[dy + Math.min(depthW - 1, Math.floor(x * depthW / W))];
        if (z >= cutoff) { const i = (y * W + x) * 4; d[i + 1] = 255; d[i + 3] = 255; }
      }
    }
  }
  mctx.putImageData(maskImg, 0, 0);

  // 6. Composite into the stage (the frame that would be sent)
  const OW = stage.width, OH = stage.height, mirror = facing === "user";
  if (debugChk.checked) {
    sctx.drawImage(video, 0, 0, OW, OH);
    sctx.globalAlpha = 0.5; sctx.drawImage(maskC, 0, 0, OW, OH); sctx.globalAlpha = 1;
  } else {
    cctx.globalCompositeOperation = "copy";
    cctx.drawImage(video, 0, 0, OW, OH);
    cctx.globalCompositeOperation = "destination-in";
    cctx.filter = `blur(${CFG.FEATHER_PX}px)`;
    cctx.drawImage(maskC, 0, 0, OW, OH);
    cctx.filter = "none";
    cctx.globalCompositeOperation = "source-over";
    drawBackground(sctx, OW, OH);
    sctx.drawImage(cut, 0, 0);
  }

  // 7. Display the composited frame directly; no safety classifier or output gate.
  octx.save();
  if (mirror) { octx.translate(OW, 0); octx.scale(-1, 1); }
  octx.drawImage(stage, 0, 0);
  octx.restore();

  // Stats
  fpsFrames++;
  if (ts - lastFpsT > 1000) { fps = fpsFrames * 1000 / (ts - lastFpsT); fpsFrames = 0; lastFpsT = ts; }
  badge.textContent = objBox ? `hand + ${CFG.ALLOWED[0]}` : handCount ? "hand" : "no hand";
  badge.style.color = objBox ? "var(--ok)" : "var(--text)";
  statsEl.textContent =
    `fps ${fps.toFixed(1)}  ·  hands ${handCount}  ·  object ${objBox ? objScore.toFixed(2) : "–"}\n` +
    `mask ${depthMode.checked ? (depthMap && ts - depthUpdatedAt < 2200 ? "depth + skin" : "depth warming up") : "original skin + hand ROI"}\n` +
    `work ${W}×${H}  ·  out ${OW}×${OH}  ·  allowlist: ${CFG.ALLOWED.join(", ")}`;
}

// ---------------- Experimental depth + skin mode ----------------
async function enableDepthMode() {
  depthControls.hidden = !depthMode.checked;
  if (!depthMode.checked) return;
  if (depthEstimator) { setStatus("Depth + skin mode ready", "ok"); return; }
  depthMode.disabled = true;
  setStatus("Loading depth model (first load is about 50–100 MB)…");
  try {
    const { pipeline, env } = await import("https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.2");
    env.allowLocalModels = false;
    try {
      depthEstimator = await pipeline("depth-estimation", "onnx-community/depth-anything-v2-small", { device: "webgpu", dtype: "fp16" });
    } catch (gpuError) {
      console.warn("WebGPU depth init failed; trying WASM", gpuError);
      depthEstimator = await pipeline("depth-estimation", "onnx-community/depth-anything-v2-small", { dtype: "q8" });
    }
    setStatus("Depth + skin mode ready. Adjust the nearest-foreground threshold below.", "ok");
  } catch (e) {
    console.error("Depth model failed", e);
    depthMode.checked = false;
    depthControls.hidden = true;
    setStatus("Depth model failed to load; original segmentation remains active: " + e.message, "bad");
  } finally { depthMode.disabled = false; }
}
function applyDepthCutoff() {
  if (!depthMap?.sortedSample?.length) return;
  const percentile = Math.max(0, Math.min(99, 100 - Number(depthNear.value)));
  depthMap.cutoff = depthMap.sortedSample[Math.floor((percentile / 100) * (depthMap.sortedSample.length - 1))] ?? 0;
  depthUpdatedAt = performance.now();
}
async function updateDepth() {
  if (!depthEstimator || depthBusy || !work.width) return;
  depthBusy = true;
  try {
    depthInput.width = work.width; depthInput.height = work.height;
    depthInputCtx.drawImage(work, 0, 0);
    const result = await depthEstimator(depthInput);
    const t = result.predicted_depth;
    if (t?.data?.length && t.dims?.length >= 2) {
      const h = t.dims[t.dims.length - 2], w = t.dims[t.dims.length - 1];
      const data = Float32Array.from(t.data);
      // Estimate a robust near-depth cutoff from a sampled percentile to ignore outliers.
      const sample = [];
      for (let i = 0; i < data.length; i += 9) if (Number.isFinite(data[i])) sample.push(data[i]);
      sample.sort((a, b) => a - b);
      depthMap = { data, width: w, height: h, sortedSample: sample };
      depthW = w; depthH = h; applyDepthCutoff();
    }
  } catch (e) { console.warn("Depth frame failed", e); }
  finally { depthBusy = false; }
}
depthMode.addEventListener("change", enableDepthMode);
depthNear.addEventListener("input", () => {
  depthNearValue.textContent = depthNear.value + "%";
  applyDepthCutoff();
});

// ---------------- Wire up ----------------
startBtn.onclick = async () => {
  try { await startCamera(); flipBtn.disabled = false; startBtn.textContent = "Restart camera"; }
  catch (e) { setStatus("Camera error: " + e.message, "bad"); }
};
flipBtn.onclick = async () => {
  facing = facing === "user" ? "environment" : "user";
  try { await startCamera(); } catch (e) { setStatus("Camera error: " + e.message, "bad"); }
};

try {
  await loadModels();
  setStatus("Models ready – tap Start camera", "ok");
  startBtn.disabled = false;
} catch (e) {
  console.error(e);
  setStatus("Model load failed: " + e.message, "bad");
}
</script>
</body>
</html>
